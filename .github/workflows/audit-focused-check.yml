name: Isolated SVG and AI regression
on:
  push:
    branches: [codex/november-isolated-check-20261106]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - name: Bind checks to the reviewed source commit
        run: |
          test "$(git rev-parse HEAD^)" = 8d34510e71990e68e8d3a2598501a0f092a9ffe2
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/audit-focused-check.yml
          pnpm exec prettier --check src/editor/svg.ts server/ai/handler.mjs tests/ai-api.mjs tests/e2e/studio-upload.mjs
      - name: Check the AI handler against in-memory SQLite and dummy providers
        run: node --test tests/ai-api.mjs
      - name: Exercise reviewed editor modules in three browsers without media or network
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { build } from 'esbuild';
          import { chromium, firefox, webkit } from '@playwright/test';

          const { outputFiles } = await build({
            stdin: {
              contents: "export { NS, documentSvg, validateProjectMarkup } from './src/editor/svg.ts'",
              resolveDir: process.cwd(),
            },
            bundle: true,
            write: false,
            format: 'iife',
            globalName: 'editorAudit',
            platform: 'browser',
          });
          for (const engine of [chromium, firefox, webkit]) {
            const browser = await engine.launch();
            try {
              const page = await browser.newPage();
              await page.route('**/*', (route) => route.abort());
              await page.setContent('<main id="fixture"></main>');
              await page.addScriptTag({ content: outputFiles[0].text });
              const actual = await page.evaluate(() => {
                const { NS, documentSvg, validateProjectMarkup } = window.editorAudit;
                const layer = {
                  id: 'vector-fixture', label: 'Fixture', kind: 'vector',
                  visible: true, locked: false, x: 0, y: 0, scaleX: 1, scaleY: 1,
                  angle: 0, opacity: 0.5,
                  markup: '<rect width="20" height="20" fill="#333333"/><?fixture > <circle id="audit-marker" r="10"/> ?>',
                };
                const model = {
                  artId: 'fixture', width: 800, height: 800, background: 'transparent',
                  layers: [layer],
                };
                validateProjectMarkup(model);
                const output = documentSvg(model);
                document.querySelector('#fixture').append(output);
                const rectangle = output.querySelector('rect');
                const result = {
                  marker: !!output.querySelector('#audit-marker'),
                  rectangle: rectangle?.namespaceURI === NS,
                  opacity: rectangle?.getAttribute('opacity'),
                  fill: rectangle?.getAttribute('fill'),
                  rejected: false,
                };
                layer.markup = '<rect width="20" height="20" onclick="alert(1)"/>';
                try {
                  validateProjectMarkup(model);
                } catch {
                  result.rejected = true;
                }
                return result;
              });
              assert.deepEqual(actual, {
                marker: false, rectangle: true, opacity: '0.5',
                fill: '#333333', rejected: true,
              });
              console.log(engine.name() + ' validated project vector rendering');
            } finally {
              await browser.close();
            }
          }
          JS
