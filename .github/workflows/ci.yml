name: Validate UltraClipart
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  # New PR commits supersede older candidates. Main artwork waves still finish
  # their complete browser matrices, so a busy publisher cannot starve production.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: Select and verify affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_browser: ${{ steps.scope.outputs.run_browser }}
      browser_suites: ${{ steps.scope.outputs.browser_suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify conservative scope policy
        run: node --test tests/ci-plan.mjs tests/ci-raster-shards.mjs
      - name: Validate workflow and planner formatting
        run: pnpm exec prettier --check .github/workflows/ci.yml scripts/ci-plan.mjs tests/ci-plan.mjs scripts/ci-raster-shards.mjs tests/ci-raster-shards.mjs
      - name: Lint workflow expressions and job dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/uc-actionlint"
          curl --fail --location --retry 2 --max-time 60 \
            -o "$RUNNER_TEMP/uc-actionlint/archive.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/uc-actionlint/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/uc-actionlint/archive.tar.gz" -C "$RUNNER_TEMP/uc-actionlint" actionlint
          "$RUNNER_TEMP/uc-actionlint/actionlint" -shellcheck= .github/workflows/ci.yml
      - name: Select affected browser groups
        id: scope
        run: node scripts/ci-plan.mjs
  browser:
    needs: plan
    if: ${{ needs.plan.outputs.run_browser == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        suite: ${{ fromJSON(needs.plan.outputs.browser_suites) }}
    # Match @playwright/test; browsers and OS libraries are already installed.
    # Pin the official image digest so a registry tag cannot change the runner.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      # GitHub owns mounted workspace/home directories as uid 1001. Firefox
      # rejects a root process whose profile home belongs to another user.
      options: --user 1001
    timeout-minutes: 90
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - name: Desktop, tablet, mobile and accessibility
        run: |
          mkdir -p reports
          pnpm exec astro preview --host 127.0.0.1 --port 4321 --ignore-lock > reports/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          PREVIEW_READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then
              PREVIEW_READY=1
              break
            fi
            if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$PREVIEW_READY" -ne 1 ]; then
            cat reports/preview.log
            exit 1
          fi
          for engine in ${{ matrix.engine }}; do
            if [ '${{ matrix.suite }}' = 'interface-core' ]; then
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/search.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/categories.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/header.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/favorite-boards.mjs
            fi
            if [ '${{ matrix.suite }}' = 'interface-artwork' ]; then
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/artwork-details.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/related.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/download-page.mjs
              UC_BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/sharing.mjs
            fi
            if [ '${{ matrix.suite }}' = 'interface-pages' ]; then
              BASE_URL=http://127.0.0.1:4321 TEST_BROWSER="$engine" node tests/e2e/site.mjs
              BASE_URL=http://127.0.0.1:4321 TEST_BROWSER="$engine" node tests/e2e/refinement.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/content.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/footer.mjs
            fi
            if [ '${{ matrix.suite }}' = 'catalog' ]; then
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/volleyball.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=baby node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=heart node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=winter node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=halloween node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=pumpkin node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=ghost node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=witch node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=skeleton node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=vampire node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=bat node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=spider node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=thanksgiving node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=turkey node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=headphones node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=headphones ALL_RASTER=1 EVIDENCE_DIR=reports/headphones-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=television node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=television ALL_RASTER=1 EVIDENCE_DIR=reports/television-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=laptop node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=laptop ALL_RASTER=1 EVIDENCE_DIR=reports/laptop-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=smartwatch node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=smartwatch ALL_RASTER=1 EVIDENCE_DIR=reports/smartwatch-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=earbuds node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=printer node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=keyboard node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=scanner node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=tablet node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=speaker node tests/e2e/collection.mjs
            fi
            if [ '${{ matrix.suite }}' = 'catalog-extra-0' ]; then
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=earbuds ALL_RASTER=1 EVIDENCE_DIR=reports/earbuds-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=printer ALL_RASTER=1 EVIDENCE_DIR=reports/printer-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=keyboard ALL_RASTER=1 EVIDENCE_DIR=reports/keyboard-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=scanner ALL_RASTER=1 EVIDENCE_DIR=reports/scanner-editor node tests/e2e/raster-editor.mjs
            fi
            if [ '${{ matrix.suite }}' = 'catalog-extra-1' ]; then
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=tablet ALL_RASTER=1 EVIDENCE_DIR=reports/tablet-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=speaker ALL_RASTER=1 EVIDENCE_DIR=reports/speaker-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_REPLACEMENTS=1 ALL_RASTER=1 EVIDENCE_DIR=reports/replacement-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_PER_TOPIC=1 node tests/e2e/raster-editor.mjs
            fi
            if [ '${{ matrix.suite }}' = 'catalog-extra-2' ]; then
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=camera ALL_DOWNLOADS=1 EVIDENCE_DIR=reports/camera node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=camera ALL_RASTER=1 EVIDENCE_DIR=reports/camera-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=wifi-router ALL_DOWNLOADS=1 EVIDENCE_DIR=reports/wifi-router node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=wifi-router ALL_RASTER=1 EVIDENCE_DIR=reports/wifi-router-editor node tests/e2e/raster-editor.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" TOPIC=robot ALL_DOWNLOADS=1 EVIDENCE_DIR=reports/robot node tests/e2e/collection.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=robot ALL_RASTER=1 EVIDENCE_DIR=reports/robot-editor node tests/e2e/raster-editor.mjs
            fi
            if [ '${{ matrix.suite }}' = 'studio' ]; then
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/studio-pro.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/studio-tools.mjs
              UC_BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" UC_EVIDENCE_DIR=reports/editor node scripts/test-editor-browser.mjs
              UC_BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" UC_EVIDENCE_DIR=reports/creator node tests/e2e/creator.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/creative-studio.mjs
              BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/real-artwork.mjs
              BASE_URL=http://127.0.0.1:4321 BROWSER="$engine" node tests/e2e/ai-builder.mjs
              UC_BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" node tests/e2e/ai-studio-transfer.mjs
              if [ '${{ matrix.engine }}' = chromium ]; then
                BASE_URL=http://127.0.0.1:4321 node tests/e2e/cute-surprise.mjs
                BASE_URL=http://127.0.0.1:4321 node tests/e2e/fruit-categories.mjs
                BASE_URL=http://127.0.0.1:4321 UC_BROWSER=chromium node tests/e2e/package-gallery.mjs
                BASE_URL=http://127.0.0.1:4321 UC_BROWSER=chromium SOURCE_COLLECTION=owner-fruit-2026-10-24 EXPECTED_ARTWORKS=550 EXPECTED_TOPICS=11 EVIDENCE_DIR=reports/fruit-gallery node tests/e2e/package-gallery.mjs
                BASE_URL=http://127.0.0.1:4321 UC_BROWSER=chromium SOURCE_COLLECTION=owner-fruit-expansion-2026-10-24 EXPECTED_ARTWORKS=1450 EXPECTED_TOPICS=29 EVIDENCE_DIR=reports/fruit-expansion node tests/e2e/package-gallery.mjs
                BASE_URL=http://127.0.0.1:4321 UC_BROWSER=chromium SOURCE_COLLECTION=owner-fruit-five-packs-2026-10-24 EXPECTED_ARTWORKS=250 EXPECTED_TOPICS=5 EVIDENCE_DIR=reports/fruit-five node tests/e2e/package-gallery.mjs
                BASE_URL=http://127.0.0.1:4321 UC_BROWSER=chromium SOURCE_COLLECTION=owner-fire-leaf-two-packs-2026-10-24 EXPECTED_ARTWORKS=100 EXPECTED_TOPICS=2 EVIDENCE_DIR=reports/fire-leaf node tests/e2e/package-gallery.mjs
                BASE_URL=http://127.0.0.1:4321 UC_BROWSER=chromium SOURCE_COLLECTION=owner-school-pack-2026-10-24 EXPECTED_ARTWORKS=50 EXPECTED_TOPICS=1 EVIDENCE_DIR=reports/school node tests/e2e/package-gallery.mjs
                BASE_URL=http://127.0.0.1:4321 UC_BROWSER=chromium SOURCE_COLLECTION=owner-basketball-pack-2026-10-24 EXPECTED_ARTWORKS=50 EXPECTED_TOPICS=1 EVIDENCE_DIR=reports/basketball node tests/e2e/package-gallery.mjs
                BASE_URL=http://127.0.0.1:4321 UC_BROWSER=chromium SOURCE_COLLECTION=owner-book-pack-2026-10-24 EXPECTED_ARTWORKS=50 EXPECTED_TOPICS=1 EVIDENCE_DIR=reports/book node tests/e2e/package-gallery.mjs
                UC_BASE_URL=http://127.0.0.1:4321 UC_EVIDENCE_DIR=reports/creator-touch node tests/e2e/creator-touch.mjs
                BASE_URL=http://127.0.0.1:4321 node tests/e2e/studio-input.mjs
                BASE_URL=http://127.0.0.1:4321 node tests/e2e/studio-upload.mjs
              fi
            fi
            case '${{ matrix.suite }}' in
              catalog-seasonal-0|catalog-seasonal-1|catalog-seasonal-2)
                UC_CI_SUITE='${{ matrix.suite }}'
                export RASTER_SHARD_COUNT=3
                export RASTER_SHARD_INDEX="${UC_CI_SUITE##*-}"
                BASE_URL=http://127.0.0.1:4321 UC_BROWSER="$engine" RASTER_TOPICS=winter,halloween,pumpkin,ghost,witch,skeleton,vampire,bat,spider,thanksgiving,turkey ALL_RASTER=1 EVIDENCE_DIR=reports/generated-editor node tests/e2e/raster-editor.mjs
                ;;
            esac
          done
      - name: Validate production CDN mapping and headers
        run: |
          CF_PAGES=1 pnpm build
          CF_PAGES=1 pnpm exec node --test tests/catalog.mjs tests/csp.mjs tests/publication.mjs
      - name: Keep browser evidence and preview log
        # Failed checks still upload evidence. Superseded cancelled candidates
        # must release their runner instead of scheduling cancellation cleanup.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.engine }}-${{ matrix.suite }}
          path: reports/
          retention-days: 14
  validate:
    name: validate (${{ matrix.engine }})
    needs: [plan, browser]
    # Run after failed dependencies too, but do not hold the next candidate
    # behind queued finalizers for a deliberately cancelled older PR run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - name: Require the selected checks to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_BROWSER: ${{ needs.plan.outputs.run_browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$PLAN_RESULT" = success
          case "$RUN_BROWSER" in
            true) test "$BROWSER_RESULT" = success ;;
            false) test "$BROWSER_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
