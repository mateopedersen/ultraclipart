name: Exact public D153 tail and WebKit preflight twice offline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout immutable public source without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mateopedersen/ultraclipart
          ref: d153c5b5e811f5cc367e193adfa843fbf1af9c18
          path: public-source
          persist-credentials: false
      - name: Prepare verified dependencies and build exact public-source fixture
        shell: bash
        run: bash fixtures/uc-public-d153-tail/prepare.sh
      - name: All remaining Studio cases twice with external network disabled
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/public-source"
          packet="$GITHUB_WORKSPACE/fixtures/uc-public-d153-tail"
          timeout --kill-after=15s 7200s docker run --rm --init --network none --read-only --ipc private --shm-size=1g --cpus 4 --memory 6g --memory-swap 6g --pids-limit 512 --cap-drop ALL --security-opt no-new-privileges --tmpfs /scratch:rw,nosuid,nodev,exec,size=1073741824,mode=1777 --mount "type=bind,src=$target,dst=/work" --mount "type=bind,src=$packet,dst=/harness,readonly" --user "$(id -u):$(id -g)" --entrypoint /usr/bin/env security-public-d153-tail -i PATH=/opt/node24/bin:/manager/node_modules/.bin:/usr/local/bin:/usr/bin:/bin HOME=/scratch/home TMPDIR=/scratch/tmp XDG_CACHE_HOME=/scratch/cache ASTRO_TELEMETRY_DISABLED=1 CI=true LANG=C.UTF-8 TZ=UTC NODE_OPTIONS=--max-old-space-size=4500 /bin/bash /harness/run-offline.sh
      - name: Preserve diagnostic screenshots only when application checks fail
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-d153-offline-preflight-failure
          path: public-source/reports/
          retention-days: 3
      - name: Emit byte-verifiable diagnostic reports without artifact storage
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: python3 fixtures/uc-public-d153-tail/emit-reports.py
