name: Verify live Studio on the installed security revision
on:
  push:
    branches: [codex/november-studio-live-check-20261106]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - name: Open the normal Studio composer on production
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium, webkit } from '@playwright/test';
          const origin = 'https://ultraclipart.com';
          const revision = 'bb8bd12b3100ea7e4f8416d46c2103992fa50d2b';
          const release = await fetch(origin + '/delivery-release.json');
          assert.equal(release.status, 200);
          assert.equal((await release.json()).controlRevision, revision);
          for (const [engine, width] of [[chromium, 1440], [webkit, 390]]) {
            const browser = await engine.launch();
            try {
              const page = await browser.newPage({ viewport: { width, height: 920 } });
              await page.route('**/*', (r) => r.request().method() === 'POST' ? r.abort() : r.continue());
              const errors = [];
              page.on('pageerror', (error) => errors.push(error.message));
              const response = await page.goto(origin + '/create/', { waitUntil: 'domcontentloaded', timeout: 45000 });
              assert.equal(response.status(), 200);
              assert((await response.text()).includes('/__ssr-client/' + revision + '/'));
              await page.getByRole('link', { name: /^Open Studio Pro/ }).click();
              await page.locator('.uc-editor:not([aria-busy=true])').waitFor({ state: 'visible', timeout: 45000 });
              await page.locator('[data-panel=studio]').click();
              await page.locator('[data-studio-tool]').selectOption('composer');
              await page.locator('.uc-canvas').waitFor({ state: 'visible' });
              assert.deepEqual(errors, []);
              console.log(JSON.stringify({ engine: engine.name(), width, revision, composer: 'PASS' }));
            } finally {
              await browser.close();
            }
          }
          JS
